services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: garden_dev
    ports:
      - "5433:5432"
    volumes:
      - garden_pgdata:/var/lib/postgresql/data

volumes:
  garden_pgdata: